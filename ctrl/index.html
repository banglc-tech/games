<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tay cầm điện thoại · Góc game</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box}*{box-sizing:inherit}html,body{height:100%;margin:0;background:#0B0D12;color:#F3F1EC;font-family:"Be Vietnam Pro",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#st{position:fixed;top:0;left:0;right:0;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));font-weight:700;font-size:14px;background:rgba(243,241,236,.06)}#st b{color:#06D6A0}#st i{color:#F5C542;font-style:normal}
#pad{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:70px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.dpad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,72px);gap:6px;justify-self:start}.dpad button{border:none;border-radius:14px;background:rgba(243,241,236,.14);color:#F3F1EC;font-size:28px;font-weight:900}.dpad button:active,.dpad button.on{background:#00e5ff;color:#0B0D12}
.ab{display:flex;flex-direction:column;gap:14px;justify-self:end;align-items:center}.ab button{width:110px;height:110px;border-radius:50%;border:4px solid #F5C542;background:rgba(243,241,236,.1);color:#F3F1EC;font:inherit;font-weight:900;font-size:18px}.ab button:active{background:#F5C542;color:#0B0D12}.ab button.b{width:80px;height:80px;border-color:#ff2d95;font-size:14px}
#who{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;opacity:.7}</style></head>
<body><div id="st">Đang kết nối…</div>
<div id="pad"><div class="dpad"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><span></span><button data-k="right">▶</button><span></span><button data-k="down">▼</button><span></span></div>
<div class="ab"><button data-k="a">A<br><small style="font-size:11px">OK / NITRO</small></button><button class="b" data-k="b">B</button></div></div>
<div id="who"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');const st=h=>document.getElementById('st').innerHTML=h;let conn=null;
if(!id)st('<i>Thiếu mã. Quét lại QR trên màn hình lớn.</i>');
const peer=new Peer(undefined,{debug:0});peer.on('open',()=>{conn=peer.connect(id,{reliable:false,serialization:'json'});conn.on('open',()=>{st('<b>Đã kết nối.</b> Bấm nút để điều khiển.');if(navigator.vibrate)navigator.vibrate(60)});conn.on('data',d=>{if(d&&d.who)document.getElementById('who').textContent='Bạn là '+d.who});conn.on('close',()=>st('<i>Mất kết nối.</i> Tải lại trang để nối lại.'));conn.on('error',()=>st('<i>Lỗi kết nối.</i>'))});
peer.on('error',e=>st('<i>Không kết nối được ('+e.type+').</i> Kiểm tra cùng Wi-Fi.'));
function send(k,d){if(conn&&conn.open)conn.send({k,d})}
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();b.classList.add('on');send(k,true);if(navigator.vibrate)navigator.vibrate(15)};const off=e=>{e.preventDefault();b.classList.remove('on');send(k,false)};b.addEventListener('pointerdown',on);for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,off)});
// trượt ngón tay trên D-pad
const dp=document.querySelector('.dpad');let cur=null;dp.addEventListener('pointermove',e=>{if(e.buttons===0)return;const el=document.elementFromPoint(e.clientX,e.clientY);const k=el&&el.dataset&&el.dataset.k;if(k!==cur){if(cur){send(cur,false);dp.querySelector('[data-k='+cur+']').classList.remove('on')}cur=k||null;if(cur){send(cur,true);el.classList.add('on')}}});dp.addEventListener('pointerup',()=>{if(cur){send(cur,false);dp.querySelector('[data-k='+cur+']').classList.remove('on');cur=null}});
setInterval(()=>{if(conn&&conn.open)conn.send({ping:1})},5000);
</script></body></html>
